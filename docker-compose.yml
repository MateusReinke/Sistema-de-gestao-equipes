services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumini}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # A aplicação só sobe depois que o banco aceita conexão.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumini} -d ${POSTGRES_DB:-lumini}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Por padrão aponta para o serviço `db` aqui do lado. Definir DATABASE_URL
      # no .env manda a aplicação para um Postgres gerenciado (Coolify, RDS,
      # Neon) — nesse caso o serviço `db` abaixo pode ser removido junto com o
      # `depends_on` e o volume.
      #
      # Senha com caractere especial (@ : / ?) precisa vir percent-encoded na
      # URL: `@` vira `%40`. Vale para os dois caminhos.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-lumini}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lumini}}
      # URL pública: precisa bater com o redirect registrado no provedor SSO.
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      # Cifra o client secret do SSO no banco. Sem ela o servidor não sobe em
      # produção; trocá-la torna o segredo já gravado ilegível.
      APP_SECRET_KEY: ${APP_SECRET_KEY:?defina APP_SECRET_KEY no .env}
      # Reabre a senha local se o provedor de identidade cair.
      ALLOW_LOCAL_LOGIN: ${ALLOW_LOCAL_LOGIN:-}
      # Só semeiam a primeira leitura; depois quem manda é a tela Autenticação.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      # Primeiro administrador, criado automaticamente se a base subir vazia
      # (ver server/db/bootstrap-admin.ts). Sem ADMIN_SENHA, uma temporária é
      # sorteada e sai só no log do deploy.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
    ports:
      # Porta fixa, não por variável: a Coolify tem bugs conhecidos de
      # interpolação de ${VAR} dentro de `ports:` (coollabsio/coolify#9136,
      # #4961, #8953) — a variável às vezes não chega e cai no valor padrão
      # do compose, ignorando o que foi definido na interface. Pra trocar a
      # porta publicada, edite o número abaixo e faça um novo deploy.
      - '8081:3000'

volumes:
  pgdata:
