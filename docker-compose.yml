services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumini}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # A aplicação só sobe depois que o banco aceita conexão.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumini} -d ${POSTGRES_DB:-lumini}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-lumini}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lumini}
      # URL pública: precisa bater com o redirect registrado no provedor SSO.
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      SESSION_HOURS: ${SESSION_HOURS:-8}
    ports:
      - '${APP_PORT:-8080}:3000'

volumes:
  pgdata:
